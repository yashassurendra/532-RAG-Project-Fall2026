services:
  redis-stack:
    image: redis/redis-stack-server:7.4.0-v6
    container_name: rag_redis_stack
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
        reservations:
          cpus: "2.0"
          memory: 2g
    command: >
      redis-stack-server
      --save ""
      --appendonly no